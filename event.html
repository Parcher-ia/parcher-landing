<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>parcher · detalle del parche</title>
  <meta name="description" content="detalle del parche en parcher. mandame DM en @soyparcher y te paso más." />

  <!-- event.html es el fallback que sirve la CDN sólo si el prerender por
       evento no está · ese estado es transitorio (race condition entre
       ingesta y prerender). Lo marcamos noindex pa' que Google no agarre
       este shell genérico como canon. Los prerenders sí van index/follow. -->
  <meta name="robots" content="noindex, follow" />

  <!-- open graph (genéricos en este fallback · los prerenders pisan con valores reales) -->
  <meta property="og:title" content="parcher · vení, parchate." />
  <meta property="og:description" content="los parches de tu ciudad." />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://parcher.co/" />
  <meta property="og:image" content="https://parcher.co/assets/og-image.png" />
  <meta property="og:locale" content="es_CO" />
  <meta property="og:site_name" content="parcher" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@soyparcher" />

  <link rel="icon" type="image/svg+xml" href="/assets/logo/parcher-monogram-avatar.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />

  <!-- GA4 plumbing -->
  <script>window.PARCHER_GA4_ID = 'G-7VSJY74C7S';</script>
  <script src="/analytics.js" async></script>
</head>
<body class="event-page">

  <!-- header · Sin wrap de .container a propósito: el .ev-brand carga su
       propia alineación (max-width + padding) en styles.css, así matchea
       la estructura de los prerenders del backend sin requerir re-prerender. -->
  <header class="ev-header">
    <a class="ev-brand" href="/" aria-label="ir al inicio de parcher">
      <img src="/assets/logo/parcher-monogram-avatar.svg" alt="" />
      <span>parcher<span class="dot">.</span></span>
    </a>
  </header>

  <!-- root: el JS reemplaza este nodo según estado (loading / 404 / ok) -->
  <main id="ev-root">
    <section class="ev-state ev-loading" aria-busy="true" aria-live="polite">
      <div class="container">
        <div class="ev-skeleton ev-skeleton-hero"></div>
        <div class="ev-skeleton ev-skeleton-line w70"></div>
        <div class="ev-skeleton ev-skeleton-line w40"></div>
        <div class="ev-skeleton ev-skeleton-line w80"></div>
      </div>
    </section>
  </main>

  <!-- footer -->
  <footer>
    <div class="container">
      <div>parcher · nace en cali · 2026</div>
      <div>
        <a href="https://instagram.com/soyparcher" target="_blank" rel="noopener">@soyparcher</a>
        &nbsp;·&nbsp;
        <a href="mailto:hola@parcher.co">hola@parcher.co</a>
      </div>
    </div>
    <div class="watermark" aria-hidden="true"></div>
  </footer>

  <!-- API base configurable: por defecto producción -->
  <script>
    window.PARCHER_API_BASE = window.PARCHER_API_BASE || 'https://api.parcher.city';
  </script>
  <script src="/event.js" defer></script>
</body>
</html>
