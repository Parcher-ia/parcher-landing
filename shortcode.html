<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>parcher · resolviendo…</title>

  <!-- No indexar el shell intermedio · el destino canónico es /e/<id> -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Acelerar la llamada al backend: handshake TLS antes de parsear el resto -->
  <link rel="preconnect" href="https://api.parcher.city" crossorigin />

  <!-- Sin fonts ni CSS · esta página existe pa' redirigir, no pa' verse.
       Inline JS en <head> sin defer pa' arrancar el fetch lo antes posible. -->
  <script>
  (function () {
    // 3 formatos coexisten en /p/<code>:
    //  · Event shortcode (7 chars base32-ish · sin 0/1/I/L/O) → API resolve a /e/<id>.
    //  · OTP-IG code (PARCHE + 4 chars sin confundibles · 10 chars · ADR 018)
    //    → redirige a ig.me/m/soyparcher?ref=<token> pa' login OTP-IG.
    //  · Parche de coordinación (10 chars base57 sin confundibles · ADR 021)
    //    → pantalla de votar de la app (app.parcher.co/p/<token>).
    var SHORTCODE_RE = /^[2-9A-HJ-NP-Za-km-z]{7}$/;            // 7 chars
    var PARCHE_TOKEN_RE = /^PARCHE[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}$/; // 10 chars (OTP-IG)
    var PARCHE_COORD_RE = /^[A-HJ-NP-Za-km-z2-9]{10}$/;        // 10 chars (coordinación · ADR 021)

    var path = window.location.pathname.split('/').filter(Boolean);
    var i = path.indexOf('p');
    var code = (i >= 0 && path[i + 1]) || path[path.length - 1] || '';

    function go404() { window.location.replace('/404.html'); }
    function goEvent(id) { window.location.replace('/e/' + encodeURIComponent(id)); }
    function goIgme(token) {
      // ref se pasa AUTENTICADO por Meta al webhook del bot · no se confía en
      // texto del usuario. La app/bot resuelve la sesión al recibir el referral.
      window.location.replace('https://ig.me/m/soyparcher?ref=' + encodeURIComponent(token));
    }
    function goParche(token) {
      // Token de coordinación (ADR 021) → pantalla de votar de la app.
      window.location.replace('https://app.parcher.co/p/' + encodeURIComponent(token));
    }

    if (!code) { go404(); return; }

    // OTP-IG primero (prefix PARCHE evita falso-positivo con coordinación/shortcode).
    if (PARCHE_TOKEN_RE.test(code)) { goIgme(code); return; }
    // Parche de coordinación (10 chars · ADR 021) → app.
    if (PARCHE_COORD_RE.test(code)) { goParche(code); return; }

    if (!SHORTCODE_RE.test(code)) { go404(); return; }

    fetch('https://api.parcher.city/api/public/shortcodes/' + encodeURIComponent(code), {
      headers: { Accept: 'application/json' },
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.event_id) goEvent(d.event_id);
        else go404();
      })
      .catch(function () { go404(); });
  })();
  </script>
</head>
<body>
  <!-- Visible solo si JS falla — fallback accesible -->
  <noscript>
    <p>Este link redirige al parche correspondiente.
      <a href="https://ig.me/m/soyparcher">Escribime por DM si no carga.</a></p>
  </noscript>
</body>
</html>
